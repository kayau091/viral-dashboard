itor": "thefinancialdiet", "caption": "We need to talk about financial abuse.\n\nHis money is your money, especially if you’re a stay at home mom. If you do not already have full and equal access to everything, change that nneeeoowwww. If he gives you trouble? 🚩 🚩🚩\n.\n.\n.\n#sahm #financialabuse #money #prenup", "transcript": "I need some other state home moms to chime in on this. My husband brings in a majority of our income. Not a state home mom, but I will weigh in on this. This is what financial abuse looks like, and it's actually a pretty extreme example because in addition to raising five children by this woman's own admission, she is also bringing income into her household. She refers to her husband as bringing in the majority of the income, but looking at her page where she has over 100,000 followers, I can assume she's probably making some money off of social media and bringing that into her household. What I'm about to say applies to everyone regardless of whether or not they are bringing money into their household. She explains that her husband essentially controls their family's debit cards and turns her access on and off based on whether or not he approves her spending. So he'll turn on her access to, for example, buy a list of groceries he's approved and turn it off if she wants to get a coffee for herself. She then has to sort of justify or earn. She's left asking like, is this okay? Is this normal? And the truth is, it is actually fairly normal. This is very common, but in no way is this okay. This is financial abuse. Although her example is pretty extreme for the reasons I gave, I just want to point out that this dynamic and the underlying principles are very common in especially hetero marriages with children where the partner who brings in most or all of the revenue to the household, typically the man feels entitled to dictate how that money is spent and essentially frames the partner's use of that money as a kind of allowance, fundamentally based on the earning partner's discretion. This is a deeply misogynist, deeply flawed and frankly, somewhat a historical way of viewing money. Money that is brought into a household is the household's money. And if one partner is taking on the majority of domestic labor in order to support the household, they are equally entitled to it. And in many cultures throughout history and still today, it is actually the woman who dictates the household spending, despite not historically bringing in the money. But domestic labor is of completely equal value to any other kind of labor. And when you are choosing to run a household and especially to rear children together, where one party is taking on the majority of outside the home labor, and the other one is taking on the majority of in-home labor, those people are completely equal. And in many, if not most cases, if you were to hire for all of the various tasks that the stay at home partner is doing, you would end up with a higher collective salary than what the person who works outside the home is being paid. So I say all this to say, especially if you are a stay at home mom, to a man, remember that his money is your money, that all of the accounts are your accounts. Ideally, that should all be established before you get married in an absolutely ironclad prenup that favors you and accounts for all of your missed earning potential if you do stay home and raise children. But if you did not do that, the second best day to do it is today. If you do not already have full and equal access to everything, do it now. And if he in any way resists, that is the biggest possible red flag, just because it's common does not make it okay.", "brk": "Hook类型: 痛点直击\n结构: 现象痛点共鸣 → 揭露财务控制本质 → 重塑家庭经济平等观\n为什么火: 戳中全职妈妈经济依附与伴侣财务控制的痛点，引发强烈共鸣与讨论。\n改编角度: 结合大马家庭现状，探讨全职太太无独立收入或卡债危机时，如何通过理财保障自身权益。", "my": "【封面：老公控制你的卡？这根本不是管钱】\n说真的，如果你每次想要买杯咖啡，都要向老公申请，甚至看他心情决定开不开卡，你要知道，这其实很常见，但绝对不正常。\n我最近在网上看到一个讨论，讲的是有些家庭里，赚钱比较多的那个人，会把家用卡的权限当成零用钱来控制。\n你想想看，家里顾小孩、打理家里这些事，难道就不是劳     const parts = ['🎬 爆款参考 @' + d.competitor + ((d.x || 0) >= 2 ? '(自家平均 ×' + d.x + ')' : ''),
      '📊 🔥' + d.score + ' | ER ' + d.er + '% | ❤️ ' + (d.likes > 0 ? fmt(d.likes) : '隐藏') +
      ' | 💬 ' + fmt(d.comments) + ' | 👥 ' + fmt(d.followers) + (ago ? ' | ' + ago : ''),
      '🔗 ' + d.url, '✍️ Hook: ' + hook];
    if (d.brk) parts.push('——— AI 拆解 ———', d.brk);
    if (d.my) parts.push('——— 我的版本(可直接拍)———', d.my);
    if (tr) parts.push('——— 竞对原口播稿 ———', tr);
    parts.push('——— 完整文案 ———', d.caption || '');
    navigator.clipboard.writeText(parts.join(NL)).then(() => toast('✓ Brief 已复制,可直接发给拍摄/剪辑', true));
  };
  io.observe(el.querySelector('.embed'));
  return el;
}

function render() {
  renderTabs();
  const arr = filtered();
  const grid = $('grid'); grid.innerHTML = '';
  arr.slice(0, shown).forEach((d, i) => grid.appendChild(card(d, i)));
  $('empty').style.display = arr.length ? 'none' : '';
  $('moreWrap').style.display = arr.length > shown ? '' : 'none';
}


function applyStatusCache() {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    Object.keys(c).forEach(rid => { const d = byRec[rid]; if (d) d.status = c[rid]; });
  } catch (e) {}
}

function cacheStatus(rid, val) {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    c[rid] = val; localStorage.setItem('st_cache', JSON.stringify(c));
  } catch (e) {}
}

// live status refresh (so weekly-baked page shows current statuses)
async function refreshStatuses() {
  applyStatusCache(); render();  // last-known statuses first
  if (Date.now() - (+localStorage.getItem('st_ts') || 0) < 600000) return;  // 10-min throttle
  localStorage.setItem('st_ts', String(Date.now()));
  const fresh = {};
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?select=post_id,status', { headers: { 'apikey': ANON } });
    if (!r.ok) return;
    (await r.json()).forEach(row => {
      const d = byRec[row.post_id];
      if (d) d.status = row.status || '未处理';
      if (row.status && row.status !== '未处理') fresh[row.post_id] = row.status;
    });
    localStorage.setItem('st_cache', JSON.stringify(fresh));
    render();
  } catch (e) {}
}

['fTracker','fComp','fSort'].forEach(id => $(id).onchange = () => { shown = PAGE; render(); });
$('fSearch').oninput = () => { shown = PAGE; render(); };
$('fVideo').onclick = () => { videoOnly = !videoOnly; $('fVideo').classList.toggle('on', videoOnly); shown = PAGE; render(); };
$('moreBtn').onclick = () => { shown += PAGE; render(); };

// preset quick filters
$('presets').innerHTML = '<span class="lbl">快筛</span>';
PRESETS.forEach(p => {
  const c = document.createElement('span'); c.className = 'chip2';
  c.innerHTML = I(p.icon) + esc(p.label);
  c.onclick = () => { presetOn[p.k] = !presetOn[p.k]; c.classList.toggle('on', presetOn[p.k]); shown = PAGE; render(); };
  $('presets').appendChild(c);
});

// trending hashtags among outlier posts
if (TRENDS.length) {
  $('trends').innerHTML = '<span class="lbl">爆款热词</span>';
  TRENDS.forEach(([tag, n]) => {
    const c = document.createElement('span'); c.className = 'chip2';
    c.textContent = '#' + tag + ' ' + n;
    c.onclick = () => { $('fSearch').value = $('fSearch').value === tag ? '' : tag; shown = PAGE; render(); };
    $('trends').appendChild(c);
  });
} else { $('trends').style.display = 'none'; }

render();
refreshStatuses();
</script>
</body>
</html>
